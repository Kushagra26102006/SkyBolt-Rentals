# ==============================================================================
# SkyBolt Rentals — Production Docker Compose Stack
# Architecture:
# - Frontend: Nginx Static Server & Reverse Proxy
# - Backend: Express REST API Cluster
# - Worker: BullMQ Background Job Processors
# - Redis: High-performance caching & message queue
# (Production MongoDB runs on managed MongoDB Atlas replica set with TLS)
# ==============================================================================

version: '3.8'

services:
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: skybolt-frontend-prod
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - skybolt-network
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M

  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: skybolt-backend-prod
    restart: unless-stopped
    env_file:
      - backend/.env.production
    environment:
      - NODE_ENV=production
      - PORT=5001
    ports:
      - "5001:5001"
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - skybolt-network
    deploy:
      resources:
        limits:
          cpus: '1.5'
          memory: 1024M
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:5001/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s

  worker:
    build:
      context: .
      dockerfile: Dockerfile.worker
    container_name: skybolt-worker-prod
    restart: unless-stopped
    env_file:
      - backend/.env.production
    environment:
      - NODE_ENV=production
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - skybolt-network
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1024M

  redis:
    image: redis:7-alpine
    container_name: skybolt-redis-prod
    restart: unless-stopped
    command: >
      redis-server
      --requirepass ${REDIS_PASSWORD:?REDIS_PASSWORD must be configured in environment}
      --maxmemory 512mb
      --maxmemory-policy volatile-lru
      --appendonly yes
      --save 900 1
      --save 300 10
    volumes:
      - redis_data:/data
    networks:
      - skybolt-network
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-skybolt_redis_prod_secure_password_123}", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3

networks:
  skybolt-network:
    driver: bridge

volumes:
  redis_data:
    driver: local
